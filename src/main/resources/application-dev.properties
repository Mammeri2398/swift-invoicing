# Development profile (default when no profile is set). Never use it in production.

# Local PostgreSQL (docker-compose.yml), still overridable through the environment
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/invoicing}
spring.datasource.username=${DB_USER:invoicing}
spring.datasource.password=${DB_PASSWORD:invoicing}

# Templates re-read on every request
spring.thymeleaf.cache=false

# Plain HTTP on localhost: the session cookie cannot be Secure
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# No mail server needed: password reset links are written to the log
mail.enabled=${MAIL_ENABLED:false}
app.base-url=${APP_BASE_URL:http://localhost:7070}
