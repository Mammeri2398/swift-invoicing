# On-premise profile: one company installs the application on its own PC or server (Windows
# installer), and a few users open it in their browser on the local network.
# Settings are not read from environment variables: the installer writes them to the file below,
# next to the application, and everything else is set in the application itself (setup wizard,
# Paramètres > Email).
spring.config.import=optional:file:./config/swift-invoicing.properties

# Defaults, replaced by the installer's file (port and generated password of the bundled PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/invoicing
spring.datasource.username=invoicing
spring.datasource.password=

# Local network: plain HTTP between the PCs of the office
server.servlet.session.cookie.secure=false

# Email: configured in Paramètres > Email (stored in the database), off until then
mail.enabled=false
# Password reset links use the address the user typed (no fixed public URL)
app.base-url=

# The first start opens the setup wizard: administrator account, company profile
app.setup.wizard=true

# Two-factor login optional by default (a small office); can be required here
app.security.two-factor.required-for=

# Never show internal details on error pages
server.error.include-message=never
server.error.include-stacktrace=never

# A service has no console: logs go to a file next to the application, rotated
logging.file.name=./logs/swift-invoicing.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
