# Production profile (SPRING_PROFILES_ACTIVE=prod, set by the Docker image).
# The shared application.properties already holds the production-safe defaults;
# ProductionSettingsCheck refuses to start with settings that are unsafe in production.

# Never show internal details on error pages
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.root=INFO
logging.level.com.swiftlabs.invoicing=INFO
