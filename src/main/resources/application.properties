spring.application.name=swift-invoicing

# Datasource (PostgreSQL, env-overridable)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/invoicing}
spring.datasource.username=${DB_USER:invoicing}
spring.datasource.password=${DB_PASSWORD:invoicing}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (schema managed by Flyway only)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.order_by.default_null_ordering=last

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Invoicing settings
invoice.number-prefix=FA
invoice.vat-mention=TVA non applicable
invoice.annual-ceiling=5000000

# Currency / locale
invoice.currency=DZD
invoice.currency-symbol=DA
invoice.locale=fr

# Server
server.port=7070
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true

# Security / password policy
security.password.min-length=8

# Mail (password reset). Set mail.enabled=false to log reset links to console instead of sending.
mail.enabled=false
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Base URL for password reset links (env-overridable)
app.base-url=${APP_BASE_URL:http://localhost:7070}
