# Shared configuration, with production-safe defaults.
# Development values are in application-dev.properties ("dev" is the default profile);
# production runs with SPRING_PROFILES_ACTIVE=prod (set by the Docker image) and must provide
# DB_URL, DB_USER, DB_PASSWORD, APP_BASE_URL and the MAIL_* settings.
spring.application.name=swift-invoicing
spring.profiles.default=dev

# Datasource: no default, every environment provides its own
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate: the schema is managed by Flyway only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.order_by.default_null_ordering=last
# Views read lazy associations (invoice.client, profile.privileges...): kept on, stated explicitly
spring.jpa.open-in-view=true

# Flyway (migrations in classpath:db/migration)
spring.flyway.enabled=true

# Server
server.port=${SERVER_PORT:7070}
server.compression.enabled=true
# Behind a reverse proxy: trust X-Forwarded-* from internal proxy addresses only (Tomcat RemoteIpValve)
server.forward-headers-strategy=native
server.shutdown=graceful

# HTTP session: idle timeout and cookie hardening.
# The cookie is Secure (HTTPS only) unless SESSION_COOKIE_SECURE=false.
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Lists: ?page=&size= (size capped so a request cannot load everything at once)
spring.data.web.pageable.max-page-size=100

# Uploads (issuer logo: the application itself accepts up to 500 KB)
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Health endpoint only, without details: /actuator/health, /actuator/health/liveness, /readiness
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# An unreachable mail server must not mark the application as down
management.health.mail.enabled=false

# Invoicing settings (see InvoiceProperties)
invoice.number-prefix=FA
invoice.vat-mention=TVA non applicable
invoice.annual-ceiling=5000000
invoice.currency=DZD
invoice.currency-symbol=DA
invoice.locale=fr

# Security (see SecurityProperties)
app.security.password.min-length=8
app.security.password.max-length=128
app.security.lockout.max-attempts=5
app.security.lockout.duration=15m
app.security.reset-token-validity=60m
# Requests per client IP (HTTP 429 beyond): login, password reset (link request + new password), public lookup
app.security.rate-limit.login.requests=10
app.security.rate-limit.login.window=5m
app.security.rate-limit.password-reset.requests=5
app.security.rate-limit.password-reset.window=15m
app.security.rate-limit.lookup.requests=30
app.security.rate-limit.lookup.window=1m
# Password of the admin account created on first start; generated and logged once when empty
app.security.initial-admin-password=${INITIAL_ADMIN_PASSWORD:}

# Mail (password reset links). In development the links are logged instead (application-dev).
mail.enabled=${MAIL_ENABLED:true}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Public URL of the application, used in password reset links
app.base-url=${APP_BASE_URL}
