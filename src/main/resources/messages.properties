# Validation messages (French), resolved by error code: Constraint.objectName.field, Constraint.field, Constraint.
# These are java.text.MessageFormat patterns: write an apostrophe as '' (a single ' would be swallowed).
# Arguments: {0} is the field, then the constraint attributes in alphabetical order
# (@Size: {1}=max {2}=min, @Digits: {1}=fraction {2}=integer, @DecimalMin: {1}=inclusive {2}=value).

# Generic
NotNull=Ce champ est obligatoire.
NotEmpty=Ce champ est obligatoire.
NotBlank=Ce champ est obligatoire.
Size=Ce texte est trop long ({1} caractères au maximum).
Email=Adresse email invalide.
Digits=Nombre trop grand ({2} chiffres au plus avant la virgule, {1} après).
DecimalMin=La valeur doit être d''au moins {2}.
typeMismatch=Valeur invalide.
typeMismatch.java.time.LocalDate=Date invalide.
typeMismatch.java.math.BigDecimal=Nombre invalide.
typeMismatch.java.lang.Long=Valeur invalide.

# Clients
NotNull.client.type=Choisissez le type de client.
Pattern.client.nif=Le NIF ne contient que des chiffres.
Pattern.client.phone=Numéro de téléphone invalide.
NifRequiredForProfessional.client.nif=Le NIF est obligatoire pour un client professionnel.

# Invoices
NotNull.invoice.clientId=Choisissez un client.
NotNull.invoice.issueDate=Indiquez la date d''émission.
NotEmpty.invoice.lines=Ajoutez au moins une ligne.
DueDateNotBeforeIssueDate.invoice.dueDate=L''échéance ne peut pas précéder la date d''émission.
DecimalMin.invoice.lines.quantity=La quantité doit être supérieure à 0.
DecimalMin.invoice.lines.unitPrice=Le prix ne peut pas être négatif.

# Issuer
Pattern.issuer.nif=Le NIF ne contient que des chiffres.
Pattern.issuer.nis=Le NIS ne contient que des chiffres.
Pattern.issuer.phone=Numéro de téléphone invalide.

# Users, profiles, privileges
Size.user.username=Le nom d''utilisateur doit contenir entre {2} et {1} caractères.
Pattern.user.username=Lettres, chiffres, point, tiret et souligné uniquement.
NotNull.user.profileId=Choisissez un profil.
Pattern.privilege.code=Lettres et _ uniquement (ex. EXPORT_INVOICES), converti en majuscules.
