# Validation messages (Arabic), resolved by error code: Constraint.objectName.field, Constraint.field, Constraint.
# These are java.text.MessageFormat patterns: write an apostrophe as '' (a single ' would be swallowed).
# Arguments: {0} is the field, then the constraint attributes in alphabetical order
# (@Size: {1}=max {2}=min, @Digits: {1}=fraction {2}=integer, @DecimalMin: {1}=inclusive {2}=value).

# Generic
NotNull=هذا الحقل إلزامي.
NotEmpty=هذا الحقل إلزامي.
NotBlank=هذا الحقل إلزامي.
Size=هذا النص طويل جدًا ({1} حرفًا كحد أقصى).
Email=عنوان بريد إلكتروني غير صالح.
Digits=العدد كبير جدًا ({2} أرقام كحد أقصى قبل الفاصلة، و{1} بعدها).
DecimalMin=يجب ألا تقل القيمة عن {2}.
typeMismatch=قيمة غير صالحة.
typeMismatch.java.time.LocalDate=تاريخ غير صالح.
typeMismatch.java.math.BigDecimal=عدد غير صالح.
typeMismatch.java.lang.Long=قيمة غير صالحة.

# Clients
NotNull.client.type=اختر نوع الزبون.
Pattern.client.nif=رقم التعريف الجبائي (NIF) يتكون من أرقام فقط.
Pattern.client.phone=رقم هاتف غير صالح.
Pattern.client.nis=رقم التعريف الإحصائي (NIS) يتكون من أرقام فقط.
NifRequiredForProfessional.client.nif=رقم التعريف الجبائي (NIF) إلزامي بالنسبة للزبون المهني.

# Invoices
NotNull.invoice.clientId=اختر زبونًا.
NotNull.invoice.issueDate=أدخل تاريخ الإصدار.
NotEmpty.invoice.lines=أضف سطرًا واحدًا على الأقل.
DueDateNotBeforeIssueDate.invoice.dueDate=لا يمكن أن يسبق تاريخ الاستحقاق تاريخ الإصدار.
DecimalMin.invoice.lines.quantity=يجب أن تكون الكمية أكبر من 0.
DecimalMin.invoice.lines.unitPrice=لا يمكن أن يكون السعر سالبًا.

# Issuer
Pattern.issuer.nif=رقم التعريف الجبائي (NIF) يتكون من أرقام فقط.
Pattern.issuer.nis=رقم التعريف الإحصائي (NIS) يتكون من أرقام فقط.
Pattern.issuer.phone=رقم هاتف غير صالح.
DecimalMin.issuer.annualCeiling=يجب أن يكون السقف أكبر من 0.

# Users, profiles, privileges
Size.user.username=يجب أن يتكون اسم المستخدم من {2} إلى {1} حرفًا.
Pattern.user.username=حروف وأرقام ونقطة وشرطة وشرطة سفلية فقط.
NotNull.user.profileId=اختر ملفًا.
Pattern.privilege.code=حروف و_ فقط (مثال: EXPORT_INVOICES)، تُحوَّل إلى أحرف كبيرة.
