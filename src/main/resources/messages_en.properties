Pattern.issuer.nif=The tax ID (NIF) has 15 or 20 digits, without spaces.
Pattern.issuer.nis=The statistical ID (NIS) has 15 digits, without spaces.
Pattern.setup.nif=The tax ID (NIF) has 15 or 20 digits, without spaces.
Pattern.setup.nis=The statistical ID (NIS) has 15 digits, without spaces.
Pattern.issuer.phone=Invalid phone number.
DecimalMin.issuer.annualCeiling=The ceiling must be greater than 0.

# Users, profiles, privileges
Size.user.username=The username must be between {2} and {1} characters long.
Pattern.user.username=Letters, digits, dot, hyphen and underscore only.
NotNull.user.profileId=Choose a profile.
Pattern.privilege.code=Letters and _ only (e.g. EXPORT_INVOICES), converted to upper case.
