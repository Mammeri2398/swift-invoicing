NotNull.client.type=Choose the type of client.
Pattern.client.nif=The tax ID (NIF) has 15 or 20 digits, without spaces.
Pattern.client.phone=Invalid phone number.
Pattern.client.nis=The statistical ID (NIS) has 15 digits, without spaces.
NifRequiredForProfessional.client.nif=The tax ID (NIF) is required for a business client.

