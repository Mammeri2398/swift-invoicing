# Validation messages (English), resolved by error code: Constraint.objectName.field, Constraint.field, Constraint.
# These are java.text.MessageFormat patterns: write an apostrophe as '' (a single ' would be swallowed).
# Arguments: {0} is the field, then the constraint attributes in alphabetical order
# (@Size: {1}=max {2}=min, @Digits: {1}=fraction {2}=integer, @DecimalMin: {1}=inclusive {2}=value).

# Generic
NotNull=This field is required.
NotEmpty=This field is required.
NotBlank=This field is required.
Size=This text is too long ({1} characters at most).
Email=Invalid email address.
Digits=Number too large (at most {2} digits before the decimal point, {1} after).
DecimalMin=The value must be at least {2}.
typeMismatch=Invalid value.
typeMismatch.java.time.LocalDate=Invalid date.
typeMismatch.java.math.BigDecimal=Invalid number.
typeMismatch.java.lang.Long=Invalid value.

