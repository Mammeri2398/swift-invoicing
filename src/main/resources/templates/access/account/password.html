<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page('Mon mot de passe', ~{::main}, ~{})}">
<body>
<main class="page-narrow">
    <div class="page-header">
        <div>
            <p class="page-eyebrow">Mon compte</p>
            <h1 class="page-title">Changer mon mot de passe</h1>
        </div>
    </div>

    <div class="alert alert-warning mb-6">
        <span class="icon">key</span>
        <span>Vous êtes connecté avec un mot de passe temporaire. Choisissez votre propre mot de passe pour continuer.</span>
    </div>

    <form th:action="@{/account/password}" method="post" class="card">
        <div class="card-body flex flex-col gap-4">
            <div class="field">
                <label class="label" for="currentPassword">Mot de passe temporaire</label>
                <input class="input" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required autofocus/>
            </div>
            <div class="field">
                <label class="label" for="newPassword">Nouveau mot de passe</label>
                <input class="input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" required/>
                <p class="hint" th:text="${passwordRules}">Règles du mot de passe</p>
            </div>
            <div class="field">
                <label class="label" for="confirmPassword">Confirmer le nouveau mot de passe</label>
                <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required/>
            </div>
            <p class="hint">Vos autres sessions ouvertes (autres navigateurs ou appareils) seront fermées.</p>
        </div>
        <div class="card-footer justify-end">
            <button type="submit" class="btn btn-primary"><span class="icon">key</span>Enregistrer</button>
        </div>
    </form>
</main>
</body>
</html>
