<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: page(#{auth.forgot.title}, ~{::main})}">
<body>
<main class="card">
    <div class="card-body flex flex-col gap-5 p-6 sm:p-8">
        <div>
            <h1 class="text-headline-md text-on-surface" th:text="#{auth.forgot.title}">Mot de passe oublié</h1>
            <p class="mt-1 text-body-md text-on-surface-variant" th:text="#{auth.forgot.text(${linkValidityMinutes})}">
                Indiquez l'email de votre compte : nous vous enverrons un lien valable 60 minutes.
            </p>
        </div>
        <form th:action="@{/forgot-password/send}" method="post" class="flex flex-col gap-4">
            <div class="field">
                <label class="label" for="email" th:text="#{auth.forgot.email}">Email</label>
                <input class="input" id="email" name="email" type="email" autocomplete="email" required autofocus/>
            </div>
            <button type="submit" class="btn btn-primary w-full py-2.5"><span class="icon">send</span><th:block th:text="#{auth.forgot.send}">Envoyer le lien</th:block></button>
        </form>
        <a th:href="@{/login}" class="inline-flex items-center gap-1 text-label-md text-primary hover:underline">
            <span class="icon icon-sm rtl-flip">arrow_back</span><th:block th:text="#{auth.backToLogin}">Retour à la connexion</th:block>
        </a>
    </div>
</main>
</body>
</html>
