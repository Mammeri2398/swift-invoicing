<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: page('Mot de passe oublié', ~{::main})}">
<body>
<main class="card">
    <div class="card-body flex flex-col gap-5 p-6 sm:p-8">
        <div>
            <h1 class="text-headline-md text-on-surface">Mot de passe oublié</h1>
            <p class="mt-1 text-body-md text-on-surface-variant">
                Indiquez l'email de votre compte : nous vous enverrons un lien valable 60 minutes.
            </p>
        </div>
        <form th:action="@{/forgot-password/send}" method="post" class="flex flex-col gap-4">
            <div class="field">
                <label class="label" for="email">Email</label>
                <input class="input" id="email" name="email" type="email" autocomplete="email" required autofocus/>
            </div>
            <button type="submit" class="btn btn-primary w-full py-2.5"><span class="icon">send</span>Envoyer le lien</button>
        </form>
        <a th:href="@{/login}" class="inline-flex items-center gap-1 text-label-md text-primary hover:underline">
            <span class="icon icon-sm">arrow_back</span>Retour à la connexion
        </a>
    </div>
</main>
</body>
</html>
