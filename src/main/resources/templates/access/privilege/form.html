<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(${privilege.id == null ? 'Nouveau privilège' : 'Modifier le privilège'}, ~{::main}, ~{})}">
<body>
<main class="page-narrow">
    <nav class="breadcrumb" aria-label="Fil d'Ariane">
        <a th:href="@{/privileges}">Privilèges</a><span class="icon icon-xs">chevron_right</span>
        <span class="text-primary" th:text="${privilege.id == null ? 'Nouveau' : privilege.code}">Nouveau</span>
    </nav>
    <div class="page-header">
        <h1 class="page-title" th:text="${privilege.id == null ? 'Nouveau privilège' : 'Modifier le privilège'}">Nouveau privilège</h1>
    </div>

    <form th:action="@{/privileges/save}" method="post" th:object="${privilege}" class="card">
        <input type="hidden" th:field="*{id}"/>
        <div class="card-body flex flex-col gap-4">
            <div th:replace="~{layout/fragments :: formErrors}"></div>
            <div class="field">
                <label class="label" for="code">Code <span class="required">*</span></label>
                <input class="input input-mono uppercase" th:errorclass="input-invalid" th:field="*{code}" type="text" required maxlength="100"
                       pattern="[A-Za-z_]+" placeholder="EXPORT_INVOICES" th:readonly="*{id != null}"/>
                <p th:replace="~{layout/fragments :: fieldError('code')}"></p>
                <p class="hint" th:text="*{id == null} ? 'Lettres et _ uniquement. Il ne pourra plus être modifié.' : 'Le code ne peut pas être modifié : il est vérifié par l\'application.'">Lettres et _ uniquement.</p>
            </div>
            <div class="field">
                <label class="label" for="name">Nom <span class="required">*</span></label>
                <input class="input" th:errorclass="input-invalid" th:field="*{name}" type="text" required maxlength="255"/>
                <p th:replace="~{layout/fragments :: fieldError('name')}"></p>
            </div>
            <div class="field">
                <label class="label" for="description">Description <span class="optional">Optionnel</span></label>
                <input class="input" th:errorclass="input-invalid" th:field="*{description}" type="text" maxlength="500"/>
                <p th:replace="~{layout/fragments :: fieldError('description')}"></p>
            </div>
        </div>
        <div class="card-footer justify-end">
            <a th:href="@{/privileges}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary"><span class="icon">save</span>Enregistrer</button>
        </div>
    </form>
</main>
</body>
</html>
