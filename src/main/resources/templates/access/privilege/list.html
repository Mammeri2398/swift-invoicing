<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(#{privilege.list.title}, ~{::main}, ~{})}">
<body>
<main class="page">
    <div class="page-header">
        <div>
            <p class="page-eyebrow" th:text="#{access.eyebrow}">Accès</p>
            <h1 class="page-title" th:text="#{privilege.list.title}">Privilèges</h1>
            <p class="page-subtitle" th:text="#{privilege.list.subtitle}">Actions élémentaires attribuées aux profils. Le code est vérifié par l'application et ne change pas.</p>
        </div>
        <a th:href="@{/privileges/new}" class="btn btn-primary"><span class="icon">add</span><th:block th:text="#{privilege.new}">Nouveau privilège</th:block></a>
    </div>

    <section class="card">
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col" th:text="#{privilege.code}">Code</th>
                    <th scope="col" th:text="#{privilege.name}">Nom</th>
                    <th scope="col" th:text="#{privilege.description}">Description</th>
                    <th scope="col"><span class="sr-only" th:text="#{access.actions}">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <!--/* Names and descriptions come from the database (seeded in French) */-->
                <tr th:each="priv : ${privileges}">
                    <td><span class="badge badge-code" th:text="${priv.code}">VIEW_INVOICES</span></td>
                    <td class="font-medium" th:text="${priv.name}">Voir les factures</td>
                    <td class="text-body-sm text-on-surface-variant" th:text="${priv.description}">Description</td>
                    <td>
                        <div class="flex justify-end gap-1">
                            <a th:href="@{/privileges/{id}/edit(id=${priv.id})}" class="btn-icon" th:title="#{action.edit}" th:aria-label="#{action.edit}"><span class="icon">edit</span></a>
                            <form th:action="@{/privileges/{id}/delete(id=${priv.id})}" method="post"
                                  th:data-confirm="#{privilege.delete.confirm(${priv.code})}">
                                <button type="submit" class="btn-icon danger" th:title="#{action.delete}" th:aria-label="#{action.delete}"><span class="icon">delete</span></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${privileges.isEmpty()}">
                    <td colspan="4" class="table-empty" th:text="#{privilege.list.empty}">Aucun privilège.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
