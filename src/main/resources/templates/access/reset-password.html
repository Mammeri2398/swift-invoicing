<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: page('Nouveau mot de passe', ~{::main})}">
<body>
<main class="card">
    <div class="card-body flex flex-col gap-5 p-6 sm:p-8">
        <div>
            <h1 class="text-headline-md text-on-surface">Nouveau mot de passe</h1>
            <p class="mt-1 text-body-md text-on-surface-variant">
                Au moins 8 caractères, avec une majuscule, une minuscule et un chiffre.
            </p>
        </div>
        <form th:action="@{/reset-password/save}" method="post" class="flex flex-col gap-4">
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="field">
                <label class="label" for="password">Nouveau mot de passe</label>
                <input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" autofocus/>
            </div>
            <div class="field">
                <label class="label" for="confirmPassword">Confirmer le mot de passe</label>
                <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8"/>
            </div>
            <button type="submit" class="btn btn-primary w-full py-2.5"><span class="icon">key</span>Réinitialiser</button>
        </form>
        <a th:href="@{/login}" class="inline-flex items-center gap-1 text-label-md text-primary hover:underline">
            <span class="icon icon-sm">arrow_back</span>Retour à la connexion
        </a>
    </div>
</main>
</body>
</html>
