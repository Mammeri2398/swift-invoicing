<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: page(#{auth.reset.title}, ~{::main})}">
<body>
<main class="card">
    <div class="card-body flex flex-col gap-5 p-6 sm:p-8">
        <div>
            <h1 class="text-headline-md text-on-surface" th:text="#{auth.reset.title}">Nouveau mot de passe</h1>
            <p class="mt-1 text-body-md text-on-surface-variant" th:text="${passwordRules}">
                Le mot de passe doit contenir entre 8 et 128 caractères, dont une majuscule, une minuscule et un chiffre.
            </p>
        </div>
        <form th:action="@{/reset-password/save}" method="post" class="flex flex-col gap-4">
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="field">
                <label class="label" for="password" th:text="#{auth.reset.password}">Nouveau mot de passe</label>
                <input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" autofocus/>
            </div>
            <div class="field">
                <label class="label" for="confirmPassword" th:text="#{auth.reset.confirm}">Confirmer le mot de passe</label>
                <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8"/>
            </div>
            <button type="submit" class="btn btn-primary w-full py-2.5"><span class="icon">key</span><th:block th:text="#{auth.reset.submit}">Réinitialiser</th:block></button>
        </form>
        <a th:href="@{/login}" class="inline-flex items-center gap-1 text-label-md text-primary hover:underline">
            <span class="icon icon-sm rtl-flip">arrow_back</span><th:block th:text="#{auth.backToLogin}">Retour à la connexion</th:block>
        </a>
    </div>
</main>
</body>
</html>
