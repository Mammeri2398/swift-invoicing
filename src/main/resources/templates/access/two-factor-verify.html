<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: page(#{twoFactor.verify.title}, ~{::main})}">
<body>
<main class="card">
    <div class="card-body flex flex-col gap-5 p-6 sm:p-8">
        <div>
            <h1 class="text-headline-md text-on-surface" th:text="#{twoFactor.verify.heading}">Vérification en deux étapes</h1>
            <p class="mt-1 text-body-md text-on-surface-variant" th:text="#{twoFactor.verify.text}">Saisissez le code à 6 chiffres affiché par votre application d'authentification.</p>
        </div>

        <form th:action="@{/login/verify}" method="post" class="flex flex-col gap-4">
            <div class="field">
                <label class="label" for="code" th:text="#{twoFactor.verify.code}">Code</label>
                <input class="input input-mono text-center text-title-md tracking-[0.3em]" id="code" name="code" type="text" dir="ltr"
                       inputmode="numeric" autocomplete="one-time-code" maxlength="20" required autofocus placeholder="123456"/>
                <!--/* Own bundle text with a <span> for the example code */-->
                <p class="hint" th:utext="#{twoFactor.verify.hint}">Téléphone perdu ? Saisissez l'un de vos codes de secours (par exemple <span class="font-mono">abcd-efgh</span>).</p>
            </div>
            <button type="submit" class="btn btn-primary mt-2 w-full py-2.5">
                <th:block th:text="#{twoFactor.verify.submit}">Vérifier</th:block><span class="icon rtl-flip">arrow_forward</span>
            </button>
        </form>

        <form th:action="@{/perform-logout}" method="post">
            <button type="submit" class="btn btn-secondary w-full"><span class="icon">logout</span><th:block th:text="#{twoFactor.verify.cancel}">Annuler et se déconnecter</th:block></button>
        </form>
    </div>
</main>
</body>
</html>
