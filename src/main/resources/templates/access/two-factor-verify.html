<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: page('Vérification', ~{::main})}">
<body>
<main class="card">
    <div class="card-body flex flex-col gap-5 p-6 sm:p-8">
        <div>
            <h1 class="text-headline-md text-on-surface">Vérification en deux étapes</h1>
            <p class="mt-1 text-body-md text-on-surface-variant">Saisissez le code à 6 chiffres affiché par votre application d'authentification.</p>
        </div>

        <form th:action="@{/login/verify}" method="post" class="flex flex-col gap-4">
            <div class="field">
                <label class="label" for="code">Code</label>
                <input class="input input-mono text-center text-title-md tracking-[0.3em]" id="code" name="code" type="text"
                       inputmode="numeric" autocomplete="one-time-code" maxlength="20" required autofocus placeholder="123456"/>
                <p class="hint">Téléphone perdu ? Saisissez l'un de vos codes de secours (par exemple <span class="font-mono">abcd-efgh</span>).</p>
            </div>
            <button type="submit" class="btn btn-primary mt-2 w-full py-2.5">
                Vérifier<span class="icon">arrow_forward</span>
            </button>
        </form>

        <form th:action="@{/perform-logout}" method="post">
            <button type="submit" class="btn btn-secondary w-full"><span class="icon">logout</span>Annuler et se déconnecter</button>
        </form>
    </div>
</main>
</body>
</html>
