<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(${client.id == null ? 'Nouveau client' : 'Modifier le client'}, ~{::main}, ~{::script})}">
<body>
<main class="page-narrow">
    <nav class="breadcrumb" aria-label="Fil d'Ariane">
        <a th:href="@{/clients}">Clients</a><span class="icon icon-xs">chevron_right</span>
        <span class="text-primary" th:text="${client.id == null ? 'Nouveau' : client.name}">Nouveau</span>
    </nav>
    <div class="page-header">
        <h1 class="page-title" th:text="${client.id == null ? 'Nouveau client' : 'Modifier le client'}">Nouveau client</h1>
    </div>

    <form th:action="@{/clients/save}" method="post" th:object="${client}" class="card" id="client-form">
        <input type="hidden" th:field="*{id}"/>
        <div class="card-body flex flex-col gap-5">
            <fieldset class="field">
                <legend class="label mb-1">Type de client <span class="required">*</span></legend>
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <label th:each="t : ${types}" class="flex cursor-pointer items-start gap-3 rounded-xl bg-surface p-3 ring-1 ring-outline-variant/60 has-[:checked]:bg-primary-fixed/40 has-[:checked]:ring-2 has-[:checked]:ring-primary">
                        <input type="radio" class="checkbox" th:field="*{type}" th:value="${t.name()}" required data-client-type/>
                        <span>
                            <span class="block font-semibold" th:text="${t.name() == 'PROFESSIONNEL'} ? 'Professionnel' : 'Particulier'">Professionnel</span>
                            <span class="hint" th:text="${t.name() == 'PROFESSIONNEL'} ? 'Entreprise, administration : NIF obligatoire' : 'Personne physique'">Entreprise</span>
                        </span>
                    </label>
                </div>
            </fieldset>

            <div class="form-grid">
                <div class="field md:col-span-2">
                    <label class="label" for="name"><span data-name-label>Nom / Raison sociale</span> <span class="required">*</span></label>
                    <input class="input" th:field="*{name}" type="text" required maxlength="255"/>
                </div>
                <div class="field md:col-span-2">
                    <label class="label" for="nif">
                        <span>NIF <span class="required" data-nif-required>*</span></span>
                        <span class="optional">15 chiffres</span>
                    </label>
                    <input class="input input-mono" th:field="*{nif}" type="text" maxlength="50" inputmode="numeric"/>
                </div>
                <div class="field md:col-span-2">
                    <label class="label" for="address">Adresse</label>
                    <input class="input" th:field="*{address}" type="text" maxlength="255"/>
                </div>
                <div class="field">
                    <label class="label" for="city">Ville</label>
                    <input class="input" th:field="*{city}" type="text" maxlength="255"/>
                </div>
                <div class="field">
                    <label class="label" for="phone">Téléphone</label>
                    <input class="input" th:field="*{phone}" type="tel" maxlength="50"/>
                </div>
                <div class="field md:col-span-2">
                    <label class="label" for="email">Email</label>
                    <input class="input" th:field="*{email}" type="email" maxlength="255"/>
                </div>
            </div>
        </div>
        <div class="card-footer justify-end">
            <a th:href="@{/clients}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary"><span class="icon">save</span>Enregistrer</button>
        </div>
    </form>
</main>
<script th:src="@{/js/client-form.js}" defer></script>
</body>
</html>
