<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${client.id != null ? 'Modifier le client' : 'Nouveau client'}">Client</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
    <h2 th:text="${client.id != null ? 'Modifier le client' : 'Nouveau client'}">Client</h2>

    <form th:action="@{/clients/save}" method="post" class="no-print">
        <input type="hidden" name="id" th:value="${client.id}"/>
        <label>Type de client</label>
        <select name="type" required>
            <option th:each="t : ${types}" th:value="${t.name()}" th:text="${t.name()}" th:selected="${client.type == t.name()}"></option>
        </select>

        <label>Nom <span style="color:#8f2d2d">*</span></label>
        <input type="text" name="name" required th:value="${client.name}" />

        <label>Adresse</label>
        <input type="text" name="address" th:value="${client.address}" />

        <label>Ville</label>
        <input type="text" name="city" th:value="${client.city}" />

        <label>Téléphone</label>
        <input type="tel" name="phone" th:value="${client.phone}" />

        <label>Email</label>
        <input type="email" name="email" th:value="${client.email}" />

        <label>NIF <span class="small" th:if="${client.type == 'PROFESSIONNEL'}">(obligatoire pour un professionnel)</span></label>
        <input type="text" name="nif" th:value="${client.nif}" />

        <div class="row-actions">
            <button class="btn primary" type="submit">Enregistrer</button>
            <a class="btn" href="/clients">Annuler</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments/header :: footer}"></div>
</body>
</html>
