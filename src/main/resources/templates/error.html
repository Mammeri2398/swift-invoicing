<!DOCTYPE html>
<!--/* Used by GlobalExceptionHandler and by Spring Boot's error handling (404, 405...) */-->
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(#{error.title}, ~{::main}, ~{})}">
<body>
<main class="page-narrow" th:with="hasMessage=${!#strings.isEmpty(message) and message != 'No message available'}">
    <section class="card">
        <div class="card-body flex flex-col items-center gap-3 py-12 text-center">
            <span class="flex h-14 w-14 items-center justify-center rounded-full bg-error-container text-error"><span class="icon icon-lg">error</span></span>
            <p class="text-label-sm uppercase tracking-wider text-on-surface-variant" th:if="${status}" th:text="#{error.status(${status})}">Erreur 500</p>
            <th:block th:switch="${status}">
                <th:block th:case="404">
                    <h1 class="text-headline-md" th:text="#{error.notFound.title}">Page introuvable</h1>
                    <p class="max-w-md text-on-surface-variant" th:text="${hasMessage} ? ${message} : #{error.notFound.text}">Introuvable.</p>
                </th:block>
                <th:block th:case="429">
                    <h1 class="text-headline-md" th:text="#{error.tooManyRequests.title}">Trop de tentatives</h1>
                    <p class="max-w-md text-on-surface-variant" th:text="#{error.tooManyRequests.text}">Trop de requêtes depuis votre adresse. Patientez quelques minutes avant de réessayer.</p>
                </th:block>
                <th:block th:case="*">
                    <h1 class="text-headline-md" th:text="#{error.generic.title}">Une erreur est survenue</h1>
                    <p class="max-w-md text-on-surface-variant" th:text="${hasMessage} ? ${message} : #{error.generic.text}">Veuillez réessayer.</p>
                </th:block>
            </th:block>
            <a th:href="@{/}" class="btn btn-primary mt-2"><span class="icon">home</span><th:block th:text="#{error.home}">Retour à l'accueil</th:block></a>
        </div>
    </section>
</main>
</body>
</html>
