<div th:fragment="header">
<header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/95 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-16 w-full max-w-7xl mx-auto px-6 lg:px-12 flex items-center justify-between gap-space-md">
        <div class="flex items-center gap-space-lg">
            <div class="flex items-center gap-space-sm">
                <a th:href="@{/}">
                    <div class="flex items-center gap-space-sm">
                        <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-on-primary shadow-sm">
                            <span class="material-symbols-outlined text-[20px]">receipt_long</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="font-title-sm text-title-sm text-primary leading-none">Swift Invoicing</span>
                            <span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Auto-Entrepreneur ANAE</span>
                        </div>
                    </div>
                </a>
            </div>
            <nav class="hidden xl:flex items-center gap-space-xs">
                <a th:href="@{/}" class="px-3 py-1.5 rounded-lg transition-colors bg-surface-container-high text-on-surface font-label-md">Tableau de bord</a>
                <a th:href="@{/clients}" class="px-3 py-1.5 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors">Clients</a>
                <a th:href="@{/invoices}" class="px-3 py-1.5 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors">Factures</a>
                <a th:href="@{/settings/issuer}" class="px-3 py-1.5 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors">Paramètres</a>
            </nav>
            <a th:href="@{/invoices/new}" class="hidden sm:inline-flex items-center gap-space-xs px-3.5 py-1.5 bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-[0_1px_3px_rgba(15,23,42,0.08)] transition-all">
                <span class="material-symbols-outlined text-[16px]">add</span><span>Nouvelle facture</span>
            </a>
        </div>
        <div class="flex items-center gap-space-md">
            <div class="relative hidden lg:block w-52">
                <span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-outline text-[16px]">search</span>
                <input class="w-full pl-8 pr-3 py-1.5 bg-surface-container-lowest text-on-surface font-body-sm text-body-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container placeholder:text-outline" placeholder="Ex: FA-2026-0001" type="text"/>
            </div>
            <div class="flex items-center gap-space-sm pl-space-sm">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
                </div>
                <div class="hidden md:flex flex-col text-left">
                    <span class="font-label-md text-label-md text-on-surface leading-tight" th:text="${#authentication != null ? #authentication.name : 'Utilisateur'}">Bonjour, admin</span>
                    <span class="inline-block px-1.5 py-0.2 rounded font-label-sm text-label-sm bg-surface-container-high text-on-surface-variant w-fit">Administrateur</span>
                </div>
                <form th:action="@{/perform-logout}" method="post" class="m-0">
                    <button type="submit" class="p-1.5 text-on-surface-variant hover:text-error hover:bg-error-container/40 rounded-lg transition-colors flex items-center justify-center" title="Se déconnecter">
                        <span class="material-symbols-outlined text-[20px]">logout</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>
</div>

<div th:fragment="footer">
<div class="container">
    <div class="footer">Swift Invoicing — Auto-entrepreneur (ANAE) · Algérie · Montants en DZD · TVA non applicable</div>
</div>
</div>
