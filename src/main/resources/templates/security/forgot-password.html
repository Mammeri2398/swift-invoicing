<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Mot de passe oublié</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
    <h2>Mot de passe oublié</h2>
    <div th:if="${message}" class="flash success" th:text="${message}"></div>
    <form th:action="@{/forgot-password/send}" method="post" style="max-width: 400px;">
        <label>Email <span style="color:#8f2d2d">*</span></label>
        <input type="email" name="email" required style="width:100%; padding:8px; border:1px solid #b9c0c6; border-radius:4px; margin-top:4px;"/>
        <button class="btn primary" type="submit" style="margin-top:12px;">Envoyer le lien de réinitialisation</button>
    </form>
    <p class="small" style="margin-top:16px;"><a href="/login">Retour à la connexion</a></p>
</div>
<div th:replace="~{fragments/header :: footer}"></div>
</body>
</html>
