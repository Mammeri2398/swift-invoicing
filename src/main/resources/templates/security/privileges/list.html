<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Privilèges</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
    <h2>Privilèges</h2>
    <p><a class="btn primary" href="/privileges/new">+ Nouveau privilège</a></p>

    <table>
        <thead>
        <tr><th>Code</th><th>Nom</th><th>Description</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${privileges}">
            <td th:text="${p.code}">-</td>
            <td th:text="${p.name}">-</td>
            <td th:text="${p.description}" class="small">-</td>
            <td class="no-print">
                <a class="btn small" th:href="@{/privileges/{id}/edit(id=${p.id})}">Modifier</a>
                <form th:action="@{/privileges/{id}/delete(id=${p.id})}" method="post" style="display:inline;"
                      onsubmit="return confirm('Supprimer ce privilège ?');">
                    <button class="btn small danger" type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
        <tr th:if="${privileges.isEmpty()}"><td colspan="4" class="text-center">Aucun privilège.</td></tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/header :: footer}"></div>
</body>
</html>
