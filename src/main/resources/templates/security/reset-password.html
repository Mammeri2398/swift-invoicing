<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Réinitialiser le mot de passe</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
    <h2>Réinitialiser le mot de passe</h2>
    <div th:if="${error}" class="flash error" th:text="${error}"></div>
    <form th:action="@{/reset-password/save}" method="post" style="max-width: 400px;">
        <input type="hidden" name="token" th:value="${token}"/>
        <label>Nouveau mot de passe <span style="color:#8f2d2d">*</span></label>
        <input type="password" name="password" required style="width:100%; padding:8px; border:1px solid #b9c0c6; border-radius:4px; margin-top:4px;"/>
        <label class="small" style="margin-top:8px;">Mot de passe : au moins 8 caractères, une majuscule, une minuscule, un chiffre.</label>
        <label>Confirmer le mot de passe <span style="color:#8f2d2d">*</span></label>
        <input type="password" name="confirmPassword" required style="width:100%; padding:8px; border:1px solid #b9c0c6; border-radius:4px; margin-top:4px;"/>
        <button class="btn primary" type="submit" style="margin-top:16px;">Réinitialiser</button>
    </form>
    <p class="small" style="margin-top:16px;"><a href="/login">Retour à la connexion</a></p>
</div>
<div th:replace="~{fragments/header :: footer}"></div>
</body>
</html>
