# Test overrides, loaded on top of src/main/resources/application.properties
# (config/ has precedence), so tests run with the real configuration except for these values.

# "test" instead of the default "dev": the dev profile would point at the local PostgreSQL
spring.profiles.default=test

# In-memory H2 in PostgreSQL mode (PostgreSQL itself: see the *Postgres* tests, run with Docker)
spring.datasource.url=jdbc:h2:mem:invoicingtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

mail.enabled=false
app.base-url=http://localhost:7070

# Rate limits out of the way: many tests log in from the same address (RateLimitFilterTest sets its own)
app.security.rate-limit.login.requests=100000
app.security.rate-limit.password-reset.requests=100000
app.security.rate-limit.lookup.requests=100000
# Two-factor login optional, except in the tests that turn it on
app.security.two-factor.required-for=

# Recurring invoices are prepared by the tests themselves
app.recurring.scheduler=false

# Services called by the tests without a request around them work in the first company
app.companies.default-schema=company_1
